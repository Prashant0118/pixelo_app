services:
  - type: web
    name: pixelo-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT myproject.asgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SERVE_MEDIA
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
