<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000000;
            color: #e9eef8;
            font-family: 'Poppins', sans-serif;
        }
        .reset-container {
            max-width: 390px;
            margin: 70px auto;
        }
        .reset-box {
            background: #101a2b;
            padding: 36px 30px;
            border: 1px solid #3b4f6f;
            text-align: center;
        }
        .reset-box h1 {
            font-family: cursive;
            font-size: 38px;
            margin-bottom: 8px;
        }
        .reset-box p {
            color: #c3cde0;
            font-size: 14px;
        }
        .btn-reset {
            background: #111111;
            border: none;
            font-weight: 600;
        }
        .btn-reset:hover {
            background: #007adf;
        }
        .form-control,
        .form-floating > .form-control {
            background: #111c2e;
            color: #e9eef8;
            border-color: #3b4f6f;
        }
        .form-floating > label {
            color: #c3cde0;
        }
        .error-text {
            color: #ff6b81;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container reset-container">
    <div class="reset-box">
        <h1>Pixelo</h1>
        <p>Enter your username or email. We will send an OTP to your registered email.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" class="form-control" name="identifier" id="identifier" placeholder="Username or email" autocomplete="username" required>
                <label for="identifier">Username or email</label>
            </div>
            <button type="submit" class="btn btn-reset w-100 text-white">Send OTP</button>
            {% if error %}
                <p class="error-text mt-3">{{ error }}</p>
            {% endif %}
        </form>
        <a href="{% url 'login' %}" class="d-inline-block mt-3 text-decoration-none">Back to login</a>
    </div>
</div>
</body>
</html>
