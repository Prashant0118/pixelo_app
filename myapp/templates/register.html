<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #000000;
            color: #e9eef8;
            font-family: 'Poppins', sans-serif;
        }

        .register-container {
            max-width: 380px;
            margin: 40px auto;
        }

        .register-box {
            background: #101a2b;
            padding: 40px 30px;
            border: 1px solid #3b4f6f;
            text-align: center;
        }

        .register-box h1 {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .btn-register {
            background: #111111;
            border: none;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #007adf;
        }

        .login-box {
            background: #101a2b;
            padding: 20px;
            border: 1px solid #3b4f6f;
            text-align: center;
            margin-top: 10px;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 13px;
            color: #555;
            color: #c3cde0;
        }

        .error-text {
            color: #ff6b81;
            font-size: 14px;
        }

        .form-control,
        .form-floating > .form-control {
            background: #111c2e;
            color: #e9eef8;
            border-color: #3b4f6f;
        }

        .form-floating > label,
        .text-muted {
            color: #c3cde0 !important;
        }
    </style>
</head>

<body>

<div class="container register-container">

    <div class="register-box">

        <h1>Pixelo</h1>
        <p class="text-muted small mb-4">Sign up to see photos and videos from your friends.</p>

        <form method="POST">
            {% csrf_token %}

            <!-- Email -->
            <div class="form-floating mb-3">
                <input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
                <label for="email">Email address</label>
            </div>

            <!-- Username -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" name="username" id="username" placeholder="Username" required>
                <label for="username">Username</label>
            </div>

            <!-- Password -->
            <div class="form-floating mb-3 password-wrapper">
                <input type="password" class="form-control" name="password1" id="password1" placeholder="Password" required>
                <label for="password1">Password</label>
                <span class="toggle-password" onclick="togglePassword('password1', this)">Show</span>
            </div>

            <!-- Confirm Password -->
            <div class="form-floating mb-3 password-wrapper">
                <input type="password" class="form-control" name="password2" id="password2" placeholder="Confirm Password" required>
                <label for="password2">Confirm Password</label>
                <span class="toggle-password" onclick="togglePassword('password2', this)">Show</span>
            </div>

            <button type="submit" class="btn btn-register w-100 text-white">Sign Up</button>

            {% if error %}
                <p class="error-text mt-3">{{ error }}</p>
            {% endif %}
        </form>

    </div>

    <div class="login-box">
        Have an account?
        <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Log in</a>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function togglePassword(fieldId, element) {
        const field = document.getElementById(fieldId);

        if (field.type === "password") {
            field.type = "text";
            element.innerText = "Hide";
        } else {
            field.type = "password";
            element.innerText = "Show";
        }
    }
</script>

</body>
</html>
