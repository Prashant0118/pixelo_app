<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #070c16;
            color: #e9eef8;
            font-family: 'Poppins', sans-serif;
        }

        .login-container {
            max-width: 380px;
            margin: 60px auto;
        }

        .login-box {
            background: #101a2b;
            padding: 40px 30px;
            border: 1px solid #3b4f6f;
            text-align: center;
        }

        .login-box h1 {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 30px;
        }

        .btn-login {
            background: #0095f6;
            border: none;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #007adf;
        }

        .signup-box {
            background: #101a2b;
            padding: 20px;
            border: 1px solid #3b4f6f;
            text-align: center;
            margin-top: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #3b4f6f;
        }

        .divider:not(:empty)::before {
            margin-right: .75em;
        }

        .divider:not(:empty)::after {
            margin-left: .75em;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #555;
            color: #c3cde0;
        }

        .error-text {
            color: #ff6b81;
            font-size: 14px;
        }

        .form-control,
        .form-floating > .form-control {
            background: #111c2e;
            color: #e9eef8;
            border-color: #3b4f6f;
        }

        .form-floating > label,
        .form-check-label,
        .text-muted {
            color: #c3cde0 !important;
        }
    </style>
</head>

<body>

<div class="container login-container">

    <!-- Login Box -->
    <div class="login-box">

        <h1>Pixelo</h1>

        <form method="POST">
            {% csrf_token %}

            <!-- Floating Username -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" name="username" id="username" placeholder="Username" required>
                <label for="username">Username</label>
            </div>

            <!-- Floating Password -->
            <div class="form-floating mb-3 password-wrapper">
                <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                <label for="password">Password</label>
                <span class="toggle-password" onclick="togglePassword()">Show</span>
            </div>

            <!-- Remember Me -->
            <div class="form-check text-start mb-3">
                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                <label class="form-check-label" for="remember">
                    Remember me
                </label>
            </div>

            <button type="submit" class="btn btn-login w-100 text-white">Log In</button>

            {% if error %}
                <p class="error-text mt-3">{{ error }}</p>
            {% endif %}
        </form>

        <div class="divider">OR</div>

        <p class="text-muted small">Forgot password?</p>

    </div>

    <!-- Signup Box -->
    <div class="signup-box">
        Don’t have an account?
        <a href="{% url 'register' %}" class="fw-bold text-decoration-none">Sign up</a>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function togglePassword() {
        const passwordField = document.getElementById("password");
        const toggleText = document.querySelector(".toggle-password");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleText.innerText = "Hide";
        } else {
            passwordField.type = "password";
            toggleText.innerText = "Show";
        }
    }
</script>

</body>
</html>
