<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000000;
            color: #e9eef8;
            font-family: 'Poppins', sans-serif;
        }
        .reset-container {
            max-width: 390px;
            margin: 70px auto;
        }
        .reset-box {
            background: #101a2b;
            padding: 36px 30px;
            border: 1px solid #3b4f6f;
            text-align: center;
        }
        .reset-box h1 {
            font-family: cursive;
            font-size: 38px;
            margin-bottom: 8px;
        }
        .reset-box p {
            color: #c3cde0;
            font-size: 14px;
        }
        .btn-reset {
            background: #111111;
            border: none;
            font-weight: 600;
        }
        .btn-reset:hover {
            background: #007adf;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #c3cde0;
        }
        .form-control,
        .form-floating > .form-control {
            background: #111c2e;
            color: #e9eef8;
            border-color: #3b4f6f;
        }
        .form-floating > label {
            color: #c3cde0;
        }
        .error-text {
            color: #ff6b81;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container reset-container">
    <div class="reset-box">
        <h1>Pixelo</h1>
        <p>Create a new password for your account.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="form-floating mb-3 password-wrapper">
                <input type="password" class="form-control reset-password-field" name="password1" id="password1" placeholder="New password" autocomplete="new-password" required>
                <label for="password1">New password</label>
                <span class="toggle-password" onclick="togglePassword('password1', this)">Show</span>
            </div>
            <div class="form-floating mb-3 password-wrapper">
                <input type="password" class="form-control reset-password-field" name="password2" id="password2" placeholder="Confirm password" autocomplete="new-password" required>
                <label for="password2">Confirm password</label>
                <span class="toggle-password" onclick="togglePassword('password2', this)">Show</span>
            </div>
            <button type="submit" class="btn btn-reset w-100 text-white">Reset Password</button>
            {% if error %}
                <p class="error-text mt-3">{{ error }}</p>
            {% endif %}
        </form>
    </div>
</div>
<script>
    function togglePassword(fieldId, toggleEl) {
        const field = document.getElementById(fieldId);
        if (field.type === "password") {
            field.type = "text";
            toggleEl.innerText = "Hide";
        } else {
            field.type = "password";
            toggleEl.innerText = "Show";
        }
    }
</script>
</body>
</html>
