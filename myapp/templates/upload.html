{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="upload-container" style="max-width:640px;margin:24px auto;">
  <h3>Create Post / Reel</h3>
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" enctype="multipart/form-data" id="simpleUploadForm">
    {% csrf_token %}

    <div style="margin-bottom:12px;">
      <label style="margin-right:12px;"><input type="radio" name="type" value="post" checked> Post (image)</label>
      <label><input type="radio" name="type" value="reel"> Reel (video)</label>
    </div>

    <div style="margin-bottom:12px;">
      <input type="file" name="media" id="mediaInput" accept="image/*" required>
    </div>

    <div id="message" style="color:#9b111e;margin-bottom:12px;display:none;"></div>

    <div style="margin-bottom:12px;">
      <textarea name="caption" placeholder="Caption (optional)" rows="3" style="width:100%;"></textarea>
    </div>

    <button type="submit" class="btn btn-primary" id="uploadBtn">Upload</button>
  </form>

</div>

{% if firebase_api_key and firebase_storage_bucket and firebase_project_id %}
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
{% endif %}

<script>
(() => {
  const form = document.getElementById('simpleUploadForm');
  const media = document.getElementById('mediaInput');
  const radios = document.querySelectorAll('input[name="type"]');
  const msg = document.getElementById('message');
  const uploadBtn = document.getElementById('uploadBtn');
  const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB

  function setAccept() {
    const t = document.querySelector('input[name="type"]:checked').value;
    media.accept = t === 'post' ? 'image/*' : 'video/*';
    msg.style.display = 'none';
  }

  radios.forEach(r => r.addEventListener('change', setAccept));
  setAccept();

  media.addEventListener('change', async () => {
    msg.style.display = 'none';
    const f = media.files && media.files[0];
    if (!f) return;
    if (f.type && f.type.startsWith('video/')) {
      // quick duration check in browser
      const url = URL.createObjectURL(f);
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.src = url;
      v.onloadedmetadata = () => {
        URL.revokeObjectURL(url);
        const secs = v.duration || 0;
        if (secs > 60) {
          // auto-switch to post and inform user
          const postRadio = document.querySelector('input[name="type"][value="post"]');
          if (postRadio) postRadio.checked = true;
          setAccept();
          msg.textContent = 'Video is longer than 1:00 — it will be uploaded as a Post (main feed).';
          msg.style.display = 'block';
        }
      };
      v.onerror = () => { URL.revokeObjectURL(url); };
    }
  });

  const firebaseConfig = {
    apiKey: "{{ firebase_api_key|default:'' }}",
    authDomain: "{{ firebase_auth_domain|default:'' }}",
    projectId: "{{ firebase_project_id|default:'' }}",
    storageBucket: "{{ firebase_storage_bucket|default:'' }}",
    appId: "{{ firebase_app_id|default:'' }}",
    measurementId: "{{ firebase_measurement_id|default:'' }}",
  };
  const directUploadMinBytes = {{ direct_upload_min_bytes|default:0 }};
  const maxDirectUploadBytes = {{ max_direct_upload_bytes|default:0 }};

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return '';
  }

  function canUseFirebase() {
    return firebaseConfig.apiKey && firebaseConfig.projectId && firebaseConfig.storageBucket && window.firebase;
  }

  function setBusy(state, text) {
    if (state) {
      uploadBtn.disabled = true;
      if (text) {
        msg.textContent = text;
        msg.style.display = 'block';
      }
    } else {
      uploadBtn.disabled = false;
    }
  }

  async function uploadInChunks(file, postType, caption) {
    const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    const uploadId = `${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
    const filename = file.name || 'upload';

    for (let i = 0; i < totalChunks; i++) {
      const start = i * CHUNK_SIZE;
      const end = Math.min(start + CHUNK_SIZE, file.size);
      const blob = file.slice(start, end);

      const formData = new FormData();
      formData.append('upload_id', uploadId);
      formData.append('chunk_index', String(i));
      formData.append('total_chunks', String(totalChunks));
      formData.append('filename', filename);
      formData.append('chunk', blob);

      const res = await fetch('/upload/chunk/', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
        body: formData
      });
      if (!res.ok) {
        throw new Error('chunk_failed');
      }

      const percent = Math.round(((i + 1) / totalChunks) * 100);
      msg.textContent = `Uploading... ${percent}%`;
      msg.style.display = 'block';
    }

    const doneForm = new FormData();
    doneForm.append('upload_id', uploadId);
    doneForm.append('total_chunks', String(totalChunks));
    doneForm.append('filename', filename);
    doneForm.append('type', postType);
    doneForm.append('caption', caption);

    const completeRes = await fetch('/upload/chunk/complete/', {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: doneForm
    });
    const data = await completeRes.json();
    if (data && data.redirect) {
      window.location.href = data.redirect;
      return;
    }
    throw new Error('complete_failed');
  }

  form.addEventListener('submit', async (e) => {
    const file = media.files && media.files[0];
    if (!file) return;

    const postType = document.querySelector('input[name="type"]:checked').value;
    const caption = (document.querySelector('textarea[name="caption"]').value || '').trim();

    // Chunked upload for large videos to avoid 502s.
    if (file.type && file.type.startsWith('video/') && file.size > CHUNK_SIZE) {
      e.preventDefault();
      setBusy(true, 'Uploading... 0%');
      try {
        await uploadInChunks(file, postType, caption);
        return;
      } catch (err) {
        msg.textContent = 'Chunked upload failed. Please try again.';
        msg.style.display = 'block';
        setBusy(false);
        return;
      }
    }

    if (!canUseFirebase()) return;
    if (directUploadMinBytes && file.size < directUploadMinBytes) return;
    if (maxDirectUploadBytes && file.size > maxDirectUploadBytes) {
      e.preventDefault();
      msg.textContent = 'File is too large for direct upload.';
      msg.style.display = 'block';
      return;
    }

    e.preventDefault();
    setBusy(true, 'Uploading... 0%');

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const storage = firebase.storage();
      const ts = Date.now();
      const safeName = (file.name || 'upload').replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `uploads/${ts}_${safeName}`;
      const uploadTask = storage.ref(path).put(file);

      uploadTask.on('state_changed', (snapshot) => {
        const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
        msg.textContent = `Uploading... ${progress}%`;
        msg.style.display = 'block';
      });

      await uploadTask;
      const downloadUrl = await storage.ref(path).getDownloadURL();

      const res = await fetch('/upload/firebase-complete/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify({
          download_url: downloadUrl,
          post_type: postType,
          caption: caption,
        }),
      });
      const data = await res.json();
      if (data && data.redirect) {
        window.location.href = data.redirect;
        return;
      }
      msg.textContent = (data && data.error) ? data.error : 'Upload completed, but response was unexpected.';
      msg.style.display = 'block';
      setBusy(false);
    } catch (err) {
      msg.textContent = 'Upload failed. Please try again.';
      msg.style.display = 'block';
      setBusy(false);
    }
  });

})();
</script>

{% endblock %}
