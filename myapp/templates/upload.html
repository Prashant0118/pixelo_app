{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="upload-container" style="max-width:640px;margin:24px auto;">
  <h3>Create Post / Reel</h3>
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" enctype="multipart/form-data" id="simpleUploadForm">
    {% csrf_token %}

    <div style="margin-bottom:12px;">
      <label style="margin-right:12px;"><input type="radio" name="type" value="post" checked> Post (image)</label>
      <label><input type="radio" name="type" value="reel"> Reel (video)</label>
    </div>

    <div style="margin-bottom:12px;">
      <input type="file" name="media" id="mediaInput" accept="image/*" required>
    </div>

    <div id="message" style="color:#9b111e;margin-bottom:12px;display:none;"></div>

    <div style="margin-bottom:12px;">
      <textarea name="caption" placeholder="Caption (optional)" rows="3" style="width:100%;"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Upload</button>
  </form>

</div>

<script>
(() => {
  const form = document.getElementById('simpleUploadForm');
  const media = document.getElementById('mediaInput');
  const radios = document.querySelectorAll('input[name="type"]');
  const msg = document.getElementById('message');

  function setAccept() {
    const t = document.querySelector('input[name="type"]:checked').value;
    media.accept = t === 'post' ? 'image/*' : 'video/*';
    msg.style.display = 'none';
  }

  radios.forEach(r => r.addEventListener('change', setAccept));
  setAccept();

  media.addEventListener('change', async () => {
    msg.style.display = 'none';
    const f = media.files && media.files[0];
    if (!f) return;
    if (f.type && f.type.startsWith('video/')) {
      // quick duration check in browser
      const url = URL.createObjectURL(f);
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.src = url;
      v.onloadedmetadata = () => {
        URL.revokeObjectURL(url);
        const secs = v.duration || 0;
        if (secs > 60) {
          // auto-switch to post and inform user
          const postRadio = document.querySelector('input[name="type"][value="post"]');
          if (postRadio) postRadio.checked = true;
          setAccept();
          msg.textContent = 'Video is longer than 1:00 — it will be uploaded as a Post (main feed).';
          msg.style.display = 'block';
        }
      };
      v.onerror = () => { URL.revokeObjectURL(url); };
    }
  });

})();
</script>

{% endblock %}
